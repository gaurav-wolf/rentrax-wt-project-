<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile | RentRax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../shared-shell.css">
</head>
<body>
  <div class="frame">
    <input class="toggle-hidden" type="checkbox" id="menu-toggle" aria-label="Toggle sidebar">
    
    <!-- Topbar Fig 1.3 -->
    <header class="topbar flex items-center justify-between">
      <div class="flex items-center gap-3">
        <label class="menu" for="menu-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></label>
        <a class="brand" href="dashboard.html">
          <img src="../logo.png" alt="RentRax Logo">
          <span>RentRax</span>
        </a>
      </div>
      <div class="flex items-center">
        <details class="user-menu">
          <summary class="flex items-center gap-2">
            <span class="avatar">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User Avatar">
            </span>
            <span class="user-name">User</span>
            <span class="chevron">⌄</span>
          </summary>
          <div class="dropdown"><a href="login.html">Log out</a></div>
        </details>
      </div>
    </header>

    <div class="layout">
      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="flex flex-col gap-1" aria-label="Main navigation">
          <a class="nav-link" href="dashboard.html"><span class="nav-icon"><i class="bi bi-grid-1x2"></i></span>Dashboard</a>
          <a class="nav-link active" href="profile.html"><span class="nav-icon"><i class="bi bi-person"></i></span>Profile</a>
          <a class="nav-link" href="order-history.html"><span class="nav-icon"><i class="bi bi-receipt"></i></span>Order History</a>
          <a class="nav-link" href="order-history.html#rentals"><span class="nav-icon"><i class="bi bi-clock-history"></i></span>Rent History</a>
          <a class="nav-link" href="rewards.html"><span class="nav-icon"><i class="bi bi-star"></i></span>Rewards &amp; Payments</a>
          <a class="nav-link" href="items.html"><span class="nav-icon"><i class="bi bi-box-seam"></i></span>Item List</a>
          <a class="nav-link" href="../about/index.html"><span class="nav-icon"><i class="bi bi-info-circle"></i></span>About Us</a>
          <a class="nav-link" href="login.html"><span class="nav-icon"><i class="bi bi-box-arrow-right"></i></span>Logout</a>
        </nav>
      </aside>

      <!-- Main Content Fig 1.3 -->
      <main class="p-4 md:p-8 min-w-0">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-[#33234E] m-0">My Profile</h1>
          <p class="text-sm text-gray-500 m-0">Manage your personal details and contact info.</p>
        </div>

        <section class="max-w-2xl bg-white/85 rounded-2xl border border-[#D6CBE7] p-6 md:p-8 shadow-sm">
          <form id="profileForm" class="grid grid-cols-1 md:grid-cols-12 gap-8 items-start" novalidate>
            
            <!-- Left Avatar & Change Photo Fig 1.3 with Free Online Portrait -->
            <div class="md:col-span-4 flex flex-col items-center text-center">
              <div class="w-28 h-28 rounded-full border-2 border-purple-400 overflow-hidden mb-3 shadow-md bg-purple-50" id="avatarPreview">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="User Profile" class="w-full h-full object-cover">
              </div>
              <label class="btn btn-sm btn-outline-primary text-xs font-semibold px-3 py-1.5 rounded-lg !border-purple-300 !text-purple-700 hover:!bg-purple-600 hover:!text-white cursor-pointer transition">
                Change Photo
                <input type="file" class="hidden" accept="image/*" onchange="previewImage(this)">
              </label>
            </div>

            <!-- Right Form Inputs Fig 1.3 -->
            <div class="md:col-span-8 flex flex-col gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="fullName">Full Name</label>
                <input type="text" id="fullName" value="User Name" class="w-full h-10 px-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-200" required>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="email">Email</label>
                <input type="email" id="email" value="user@email.com" class="w-full h-10 px-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-200" required>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="phone">Phone</label>
                <input type="tel" id="phone" value="9876543210" class="w-full h-10 px-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-200" required>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1" for="address">Address</label>
                <input type="text" id="address" value="123, Street, City, State, PIN" class="w-full h-10 px-3 border border-gray-300 rounded-lg text-sm outline-none focus:border-purple-600 focus:ring-1 focus:ring-purple-200" required>
              </div>

              <button type="submit" class="btn w-full h-11 bg-[#2D233C] hover:bg-purple-700 text-white font-semibold rounded-lg shadow transition mt-2">Update Profile</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <footer class="footer">© 2025 RentRax. All rights reserved.</footer>
  </div>

  <script>
    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" class="w-full h-full rounded-full object-cover">`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function validateProfile(event) {
      event.preventDefault();

      const nameInput = document.getElementById('fullName');
      const emailInput = document.getElementById('email');
      const phoneInput = document.getElementById('phone');
      const addressInput = document.getElementById('address');
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const phone = phoneInput.value.trim();
      const address = addressInput.value.trim();

      if (name.length < 2) {
        alert('Enter a name with at least 2 characters.');
        nameInput.focus();
        return;
      }
      if (!email || !emailInput.checkValidity()) {
        alert('Please enter a valid email address.');
        emailInput.focus();
        return;
      }
      if (!/^\d{10}$/.test(phone)) {
        alert('Enter a 10-digit phone number.');
        phoneInput.focus();
        return;
      }
      if (address.length < 5) {
        alert('Enter a more complete address.');
        addressInput.focus();
        return;
      }
      if (!confirm('Save these profile changes?')) return;

      alert('Profile updated successfully.');
    }

    document
      .getElementById('profileForm')
      .addEventListener('submit', validateProfile);
  </script>
</body>
</html>
